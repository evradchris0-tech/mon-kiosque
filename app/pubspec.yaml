name: mon_kiosque
description: "Mon Kiosque — Le 3-en-1 de la PME camerounaise. Propulsé par Moki."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
