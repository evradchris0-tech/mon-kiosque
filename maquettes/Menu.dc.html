<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","suivi","reservation","parcours","modeles","alertes","historique","concurrence","assistant","parametres","connexions","suspendre","aide"],"default":"accueil"},"$preview":{"width":250,"height":980}}'>
class Component extends DCLogic {
componentDidMount() {
if (typeof window !== 'undefined' && window.innerWidth < 720) this.setState({ collapsed: true });
}
renderVals() {
const c = !!(this.state && this.state.collapsed);
const a = this.props.active ?? 'accueil';
const s = {};
['accueil','suivi','reservation','parcours','modeles','alertes','historique','concurrence','assistant','parametres','connexions','suspendre','aide'].forEach((k) => {
const on = k === a;
s[k] = { bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#12211D' : '#E2EFEA', w: on ? 600 : 500, light: on ? 'none' : 'block', dark: on ? 'block' : 'none', cur: on ? 'page' : 'false' };
});
return {
s,
width: c ? '76px' : '250px',
lab: c ? 'none' : 'block',
mono: c ? 'block' : 'none',
just: c ? 'center' : 'flex-start',
flip: c ? 'rotate(180deg)' : 'none',
expanded: c ? 'false' : 'true',
toggleLabel: c ? 'Déplier le menu' : 'Replier le menu',
toggle: () => this.setState({ collapsed: !c })
};
}
}
</script>
